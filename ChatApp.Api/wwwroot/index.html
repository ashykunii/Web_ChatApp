<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatApp</title>
    <link rel="stylesheet" href="style.css?v=10" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
</head>

<body class="light-theme">

    <!-- Auth Screen -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-card">
            <h1>ChatApp</h1>
            <div class="auth-subtitle">Clean, real-time messaging solution</div>

            <div class="auth-tabs">
                <button id="tabLogin" class="active">Login</button>
                <button id="tabRegister">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUserName" required autocomplete="username" />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password" />
                </div>
                <button type="submit" class="btn btn-block">Login</button>
                <div id="loginError" class="error"></div>
            </form>

            <!-- Register Form -->
            <form id="registerForm" style="display:none;">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUserName" required autocomplete="username" />
                </div>
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="regDisplayName" required />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required autocomplete="email" />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required minlength="6" autocomplete="new-password" />
                </div>
                <button type="submit" class="btn btn-block">Register</button>
                <div id="regError" class="error"></div>
                <div id="regSuccess" class="success"></div>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <button class="hamburger-btn" id="btnHamburger" title="Menu">
                    <svg viewBox="0 0 24 24" width="22" height="22">
                        <path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
                    </svg>
                </button>
                <input type="text" id="userSearch" placeholder="Search contacts or groups..." />
            </div>
            <div class="sidebar-list" id="sidebarList"></div>
        </aside>

        <!-- Chat Pane -->
        <main class="chat-pane" id="chatPane">
            <div class="empty-state">Select a contact or group to start chatting.</div>
        </main>

        <!-- ── Contact / Group Info Right Panel ── -->
        <div class="info-panel-overlay" id="infoPanelOverlay"></div>
        <aside class="info-panel" id="infoPanel">
            <div class="info-panel-header">
                <button class="info-panel-close" id="infoPanelClose" title="Close">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor"
                            d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z" />
                    </svg>
                </button>
                <span>Info</span>
            </div>
            <div class="info-panel-body" id="infoPanelBody">
                <!-- Dynamically populated -->
            </div>
        </aside>

        <!-- ── In-Chat Search Bar ── -->
        <div class="chat-search-overlay" id="chatSearchOverlay">
            <div class="chat-search-bar">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path fill="currentColor"
                        d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                </svg>
                <input type="text" id="chatSearchInput" placeholder="Search messages..." />
                <span class="chat-search-count" id="chatSearchCount"></span>
                <button class="chat-search-nav" id="chatSearchPrev" title="Previous">&#8593;</button>
                <button class="chat-search-nav" id="chatSearchNext" title="Next">&#8595;</button>
                <button class="chat-search-close" id="chatSearchClose">&times;</button>
            </div>
        </div>

        <!-- Drawer Slide-out Overlay -->
        <div class="drawer-overlay" id="drawerOverlay"></div>

        <!-- Slide-out Drawer -->
        <div class="drawer" id="drawer">
            <div class="drawer-profile-banner">
                <div class="drawer-avatar" id="drawerAvatar"></div>
                <div class="drawer-user-info">
                    <div class="drawer-name" id="drawerDisplayName">User Name</div>
                    <div class="drawer-status" id="drawerPresenceStatus">Set presence status</div>
                </div>
            </div>
            <div class="drawer-menu">
                <a id="drawerMenuProfile"><span class="menu-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16"
                            height="16" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 18 18">
                            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
                            <path fill-rule="evenodd"
                                d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1" />
                        </svg></span>My Profile</a>
                <a id="drawerMenuNewGroup" class="drawer-parent"><span class="menu-icon"><svg
                            xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-people-fill" viewBox="0 0 16 16">
                            <path
                                d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5.784 6A2.24 2.24 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.3 6.3 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1zM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5" />
                        </svg></span>New Group</a>
                <a id="drawerMenuBulkMessage" class="drawer-child"><span class="menu-icon">Bulk Message</span></a>
                <a id="drawerMenuContacts"><span class="menu-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16"
                            height="16" fill="currentColor" class="bi bi-person-lines-fill" viewBox="0 0 18 18">
                            <path
                                d="M6 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5 6s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zM11 3.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 1-.5-.5m.5 2.5a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1zm2 3a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1zm0 3a.5.5 0 0 0 0 1h2a.5.5 0 0 0 0-1z" />
                        </svg></span>Contacts</a>
                <a id="drawerMenuSettings"><span class="menu-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16"
                            height="16" fill="currentColor" class="bi bi-gear-fill" viewBox="0 0 18 18">
                            <path
                                d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z" />
                        </svg></span>Settings</a>
            </div>
            <button id="menuLogout" class="btn btn-secondary">Logout</button>
            <div class="drawer-footer">
                Web_ChatApp<br>
                Version 2.5.0 – About
            </div>
        </div>

        <!-- Message Context Menu -->
        <div class="msg-context-menu" id="msgContextMenu">
            <a id="msgCtxReply"><span class="menu-icon"></span> Reply</a>
            <a id="msgCtxEdit"><span class="menu-icon"></span> Edit Message</a>
            <a id="msgCtxCopy"><span class="menu-icon"></span> Copy Text</a>
            <a id="msgCtxPin"><span class="menu-icon"></span> Pin Message</a>
            <a id="msgCtxDelete" class="danger"><span class="menu-icon"></span> Delete Message</a>
        </div>

        <!-- Emoji Picker Popup -->
        <div class="emoji-picker-popup" id="emojiPickerPopup"></div>

        <!-- Modal Backdrop -->
        <div id="modalBackdrop" class="modal-backdrop">
            <div class="modal" id="modalContent"></div>
        </div>

        <!-- Toast Container -->
        <div class="toast-container" id="toastContainer"></div>

        <script src="app.js?v=10"></script>
</body>

</html>
